<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex">
<title>پرداخت من</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.20/400.css" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2309090b'/><path d='M19 33l9 9 17-19' stroke='%233ddc97' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="/base.css">
<style>
.nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);border-bottom:1px solid var(--line-2)}
.nav-in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.nav .status{margin-inline-start:12px}
.nav-acts{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.btn.sm{width:auto;margin:0;padding:6px 12px;font-size:13px;border-radius:8px;gap:8px}
.btn.sm kbd{font-size:10.5px}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{color:var(--ink);background:var(--raised)}
.icon-btn svg{width:16px;height:16px}
.wrap.app{display:block;max-width:880px;margin:0 auto;padding:22px 16px 110px;min-height:auto}
.head{margin-bottom:14px}
.head h1{font-size:20px;margin:0}.head p{margin:0;color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:1.35fr 1fr;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--hi);overflow:hidden;margin-bottom:22px}
.kpi-main{padding:18px 20px 14px;border-inline-end:1px solid var(--line-2);display:flex;flex-direction:column}
.kpi-label{font-size:12.5px;color:var(--muted)}
.kpi-main .big{font-size:32px;font-weight:800;letter-spacing:-.5px;line-height:1.3;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.kpi-main .big small{font-size:13px;font-weight:500;color:var(--muted);margin-inline-start:6px}
.spark{display:flex;align-items:flex-end;gap:4px;height:46px;margin-top:auto;direction:ltr}
.spark i{flex:1;min-height:2px;border-radius:3px 3px 1px 1px;background:var(--line);transition:background .15s}
.spark i.has{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.spark i.today{background:var(--accent)}
.spark i:hover{background:var(--ink)}
.spark-axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:6px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr}
.kpi{padding:14px 18px;border-bottom:1px solid var(--line-2)}
.kpi:nth-child(odd){border-inline-end:1px solid var(--line-2)}
.kpi:nth-child(n+3){border-bottom:0}
.kpi b{display:block;font-size:19px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b small{font-size:12px;font-weight:500;color:var(--muted);margin-inline-start:4px}
@media(max-width:640px){.kpis{grid-template-columns:1fr}.kpi-main{border-inline-end:0;border-bottom:1px solid var(--line-2)}}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;border-bottom:1px solid var(--line-2);overflow-x:auto;scrollbar-width:none}
.tabs{display:flex;gap:18px}
.tabs button{position:relative;border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--muted);padding:8px 0 11px;cursor:pointer;display:flex;align-items:center;gap:7px}
.tabs button:hover,.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.count{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted);background:var(--raised);border:1px solid var(--line);border-radius:5px;padding:0 5px;line-height:1.6}
.filters{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px 10px}
.filters button{border:0;background:none;color:var(--muted);font:inherit;font-size:12.5px;padding:3px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.filters button:hover{color:var(--ink)}
.filters button.on{color:var(--ink);background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)}
.list{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-2);transition:background .12s}
.item:last-child{border:0}
.item:hover{background:color-mix(in srgb,var(--raised) 55%,transparent)}
.st{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.st.active{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.st.paid,.st.ok{background:var(--ok)}.st.failed{background:var(--bad)}
.it{min-width:0}
.it b{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;line-height:1.5}
.it b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it small{display:flex;flex-wrap:wrap;gap:2px 10px;color:var(--muted);font-size:12px}
.it small code{font-size:11.5px;color:var(--faint);direction:ltr}
.badge{flex:none;font-style:normal;font-size:11px;font-weight:600;padding:0 7px;border-radius:5px;line-height:1.75;border:1px solid}
.badge.active{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line)}
.badge.paid,.badge.ok{color:var(--ok);background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.badge.failed{color:var(--bad);background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.badge.off,.badge.init{color:var(--muted);background:var(--raised);border-color:var(--line)}
.amt{text-align:left;white-space:nowrap;font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums}
.amt small{display:block;font-size:11px;font-weight:400;color:var(--muted);line-height:1.2}
.ops{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:4px;opacity:0;height:0;overflow:hidden;transition:opacity .12s}
.item:hover .ops,.item:focus-within .ops{opacity:1;height:auto;margin-top:6px}
@media (hover:none){.ops{opacity:1;height:auto;margin-top:6px}}
.ops button{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:12px;padding:2px 9px;border-radius:6px;cursor:pointer}
.ops button:hover{color:var(--ink);background:var(--raised)}
.ops button svg{width:13px;height:13px}
.ops button.danger{margin-inline-start:auto}.ops button.danger:hover{color:var(--bad)}
.empty{padding:46px 20px;text-align:center;color:var(--muted);font-size:14px}
.empty code{display:inline-block;margin-top:8px;font-size:12px;color:var(--faint)}
.mobile-cta{display:none;position:fixed;z-index:6;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);border-top:1px solid var(--line-2)}
.mobile-cta .btn{margin:0}
@media(max-width:640px){.nav #new,.nav .status,.head{display:none}.mobile-cta{display:block}.item{padding:12px 14px}.ops{grid-column:1 / 4}}
.sheet-bg{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet-bg.on{display:flex}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:100%;max-width:460px;max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow),var(--hi);animation:up .2s ease-out}
.sheet::before{content:"";position:absolute;top:-1px;left:18%;right:18%;height:1px;background:linear-gradient(90deg,transparent,var(--accent-line),transparent)}
@media(min-width:560px){.sheet-bg{align-items:center}.sheet{border-radius:14px}}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet-h h3{margin:0;font-size:16px}.sheet-h kbd{font-size:11px;color:var(--faint);border:1px solid var(--line);padding:0 6px;border-radius:5px}
.toggle{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line-2);cursor:pointer}
.toggle div{flex:1}.toggle b{display:block;font-size:13.5px;font-weight:600}.toggle small{color:var(--muted);font-size:12px}
.toggle input{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:.15s;flex:none;margin:0}
.toggle input::after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.toggle input:checked{background:var(--accent)}.toggle input:checked::after{right:16px}
.urlbox{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:5px 5px 5px 12px;margin:16px 0 12px}
.urlbox code{flex:1;direction:ltr;text-align:left;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--accent)}
.urlbox button{border:1px solid var(--line);background:var(--raised);color:var(--ink);font:inherit;font-size:12px;padding:4px 10px;border-radius:6px;cursor:pointer}
.toast{position:fixed;z-index:20;bottom:84px;left:50%;transform:translate(-50%,10px);opacity:0;background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:8px;font-size:13px;transition:.2s;pointer-events:none;display:flex;gap:8px;align-items:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.toast svg{width:14px;height:14px;color:var(--accent)}
.skel{height:58px;border-bottom:1px solid var(--line-2);background:linear-gradient(90deg,transparent,var(--raised),transparent);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet-bg" id="sheet-bg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const $ = (s) => document.querySelector(s)
const fa = (n) => Number(n || 0).toLocaleString('fa-IR')
const en = (s) => String(s).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^0-9]/g, '')
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const DATE = new Intl.DateTimeFormat('fa-IR-u-ca-persian', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tehran' })
const DAY = new Intl.DateTimeFormat('fa-IR-u-ca-persian', { month: 'short', day: 'numeric', timeZone: 'Asia/Tehran' })
const date = (iso) => (iso ? DATE.format(new Date(iso)) : '')
function words(n) {
  const p = [], b = Math.floor(n / 1e9), m = Math.floor((n % 1e9) / 1e6), k = Math.floor((n % 1e6) / 1e3), r = n % 1e3
  if (b) p.push(fa(b) + ' میلیارد'); if (m) p.push(fa(m) + ' میلیون'); if (k) p.push(fa(k) + ' هزار'); if (r) p.push(fa(r))
  return p.join(' و ') + ' تومان'
}
const short = (n) => (n >= 1e9 ? fa(+(n / 1e9).toFixed(1)) + ' میلیارد' : n >= 1e6 ? fa(+(n / 1e6).toFixed(1)) + ' میلیون' : n >= 1e3 ? fa(Math.round(n / 1e3)) + ' هزار' : fa(n))
const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`
const I = {
  copy: svg('<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>'),
  share: svg('<path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>'),
  pause: svg('<path d="M9 6v12M15 6v12"/>'),
  play: svg('<path d="M8 5.5v13l10-6.5z"/>'),
  trash: svg('<path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/>'),
  open: svg('<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'),
  out: svg('<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/>'),
  ok: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  x: svg('<path d="M7 7l10 10M17 7L7 17"/>'),
}

let tg = window.Telegram?.WebApp
let token = null
try { token = localStorage.getItem('mp_token') } catch {}
const S = { tab: 'links', filter: 'all', links: null, payments: null, stats: null }

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined })
  const j = await r.json().catch(() => ({}))
  if (r.status === 401 && path !== '/api/login') { logout(); throw new Error('unauth') }
  if (!r.ok) throw new Error(j.error || 'خطایی پیش اومد')
  return j
}
function setToken(t) { token = t; try { t ? localStorage.setItem('mp_token', t) : localStorage.removeItem('mp_token') } catch {} }
function logout() { setToken(null); renderLogin() }
function toast(t) { const el = $('#toast'); el.innerHTML = I.ok + esc(t); el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2000); tg?.HapticFeedback?.notificationOccurred('success') }
async function copy(t) { try { await navigator.clipboard.writeText(t) } catch { const a = document.createElement('textarea'); a.value = t; document.body.append(a); a.select(); document.execCommand('copy'); a.remove() } toast('لینک کپی شد') }
function share(l) {
  const text = `${l.title || 'لینک پرداخت'}${l.amount ? ' — ' + fa(l.amount) + ' تومان' : ''}`
  if (tg) return tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(l.url)}&text=${encodeURIComponent(text)}`)
  if (navigator.share) return navigator.share({ title: text, text, url: l.url }).catch(() => {})
  copy(l.url)
}
const brand = () => `<span class="mark">ح</span><span class="path mono">${esc(location.host)}<i>/</i><b>admin</b></span>`

function renderLogin(err = '') {
  $('#app').innerHTML = `<main class="wrap"><div class="stack"><header class="brand">${brand()}</header>
    <form class="card" id="lf"><div class="eyebrow">پنل مدیریت</div><h1>ورود</h1><p class="desc">برای ساخت لینک پرداخت و دیدن تاریخچه وارد شو.</p>
    ${err ? `<div class="err"><span>${esc(err)}</span></div>` : ''}
    <div class="field" style="margin-top:20px"><label>نام کاربری</label><input class="input mono" name="user" autocomplete="username" dir="ltr" required autofocus></div>
    <div class="field"><label>رمز عبور</label><input class="input mono" name="pass" type="password" autocomplete="current-password" dir="ltr" required></div>
    <button class="btn" id="lb"><span class="spin"></span>ورود<kbd>↵</kbd></button></form></div></main>`
  $('#lf').onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target); $('#lb').disabled = true
    try { const r = await api('POST', '/api/login', { user: f.get('user'), pass: f.get('pass') }); setToken(r.token); boot() }
    catch (x) { renderLogin(x.message) }
  }
}

function shell() {
  $('#app').innerHTML = `
  <header class="nav"><div class="nav-in">${brand()}<span class="status"><i></i>درگاه فعال</span>
    <div class="nav-acts"><button class="btn sm" id="new">لینک جدید<kbd>N</kbd></button>
    ${tg?.initData ? '' : `<button class="icon-btn" id="out" title="خروج">${I.out}</button>`}</div></div></header>
  <main class="wrap app">
    <div class="head"><h1>داشبورد</h1><p>لینک بساز، بفرست، دریافتی‌ها رو دنبال کن.</p></div>
    <section id="kpis"></section>
    <div class="bar"><nav class="tabs" id="tabs"></nav></div><div class="filters" id="filters"></div>
    <section class="list" id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></section>
  </main>
  <div class="mobile-cta"><button class="btn" id="new-m">ساخت لینک پرداخت</button></div>`
  $('#out') && ($('#out').onclick = logout)
  $('#new').onclick = $('#new-m').onclick = openCreate
}

function renderKpis() {
  const s = S.stats
  if (!s) return
  const max = Math.max(1, ...s.series.map((d) => d.sum))
  const bars = s.series.map((d, i) => `<i class="${d.sum ? 'has' : ''}${i === s.series.length - 1 ? ' today' : ''}" style="height:${Math.max(4, (d.sum / max) * 100)}%" title="${DAY.format(new Date(d.day + 'T12:00:00+03:30'))}: ${fa(d.sum)} تومان"></i>`).join('')
  $('#kpis').innerHTML = `<div class="kpis">
    <div class="kpi-main"><div class="kpi-label">کل دریافتی</div><div class="big">${fa(s.total_sum)}<small>تومان</small></div>
      <div class="spark">${bars}</div><div class="spark-axis"><span>امروز</span><span>۱۴ روز اخیر</span></div></div>
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">امروز</div><b>${short(s.today_sum)}<small>${s.today_sum ? 'تومان' : ''}</small></b></div>
      <div class="kpi"><div class="kpi-label">۳۰ روز اخیر</div><b>${short(s.month_sum)}<small>${s.month_sum ? 'تومان' : ''}</small></b></div>
      <div class="kpi"><div class="kpi-label">پرداخت موفق</div><b>${fa(s.total_count)}</b></div>
      <div class="kpi"><div class="kpi-label">لینک فعال</div><b>${fa(s.active_links)}<small>از ${fa(s.links)}</small></b></div>
    </div></div>`
}

const LINK_STATE = { active: 'فعال', paid: 'پرداخت شد', off: 'متوقف' }
const PAY_STATE = { paid: ['موفق', 'ok'], failed: ['ناموفق', 'failed'], init: ['نیمه‌کاره', 'init'] }

function render() {
  const n = (arr) => (arr ? fa(arr.length) : '…')
  $('#tabs').innerHTML = `<button data-t="links" class="${S.tab === 'links' ? 'on' : ''}">لینک‌ها<span class="count">${n(S.links)}</span></button>
    <button data-t="payments" class="${S.tab === 'payments' ? 'on' : ''}">پرداخت‌ها<span class="count">${n(S.payments)}</span></button>`
  document.querySelectorAll('#tabs button').forEach((b) => (b.onclick = () => { S.tab = b.dataset.t; S.filter = 'all'; tg?.HapticFeedback?.selectionChanged(); render() }))
  const F = S.tab === 'links' ? [['all', 'همه'], ['active', 'فعال'], ['paid', 'پرداخت‌شده'], ['off', 'متوقف']] : [['all', 'همه'], ['paid', 'موفق'], ['failed', 'ناموفق'], ['init', 'نیمه‌کاره']]
  $('#filters').innerHTML = F.map(([k, t]) => `<button class="${S.filter === k ? 'on' : ''}" data-f="${k}">${t}</button>`).join('')
  document.querySelectorAll('#filters button').forEach((b) => (b.onclick = () => { S.filter = b.dataset.f; render() }))
  const list = $('#list')
  if (S.tab === 'links') {
    if (!S.links) return
    const rows = S.links.filter((l) => S.filter === 'all' || l.state === S.filter)
    if (!rows.length) return (list.innerHTML = empty(S.links.length ? 'چیزی با این فیلتر نیست' : 'هنوز لینکی نساختی', !S.links.length))
    list.innerHTML = rows.map((l) => `<article class="item">
      <span class="st ${l.state}"></span>
      <div class="it"><b><span>${esc(l.title || 'بدون عنوان')}</span><em class="badge ${l.state}">${LINK_STATE[l.state]}</em></b>
        <small><code>/p/${esc(l.code)}</code><span>${date(l.created_at)}</span>${l.single_use ? '' : '<span>چندبار مصرف</span>'}${l.paid_count ? `<span>دریافتی ${fa(l.paid_sum)} تومان (${fa(l.paid_count)})</span>` : ''}</small></div>
      <div class="amt">${l.amount ? fa(l.amount) : 'آزاد'}<small>${l.amount ? 'تومان' : 'مبلغ دلخواه'}</small></div>
      <div class="ops"><button data-a="copy" data-id="${l.id}">${I.copy}کپی</button><button data-a="share" data-id="${l.id}">${I.share}ارسال</button>
        <button data-a="open" data-id="${l.id}">${I.open}باز کردن</button>
        <button data-a="toggle" data-id="${l.id}">${l.active ? I.pause + 'توقف' : I.play + 'فعال'}</button>
        <button class="danger" data-a="del" data-id="${l.id}">${I.trash}حذف</button></div></article>`).join('')
    list.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => linkAction(b.dataset.a, Number(b.dataset.id))))
  } else {
    if (!S.payments) return
    const rows = S.payments.filter((p) => S.filter === 'all' || p.status === S.filter)
    if (!rows.length) return (list.innerHTML = empty(S.payments.length ? 'چیزی با این فیلتر نیست' : 'هنوز پرداختی انجام نشده'))
    list.innerHTML = rows.map((p) => {
      const [st, cls] = PAY_STATE[p.status]
      const about = p.title && p.title !== 'پرداخت مستقیم' ? p.title : p.note
      return `<article class="item">
      <span class="st ${cls}"></span>
      <div class="it"><b><span>${esc(p.payer_name || about || 'پرداخت')}</span><em class="badge ${cls}">${st}</em></b>
        <small><span>${date(p.paid_at || p.created_at)}</span>${p.payer_name && about ? `<span>${esc(about)}</span>` : ''}${p.payer_phone ? `<code>${esc(p.payer_phone)}</code>` : ''}${p.ref_id ? `<code>ref ${esc(p.ref_id)}</code>` : ''}${p.card_pan ? `<code>${esc(p.card_pan)}</code>` : ''}</small>
        ${p.note && p.note !== about ? `<small><span>«${esc(p.note)}»</span></small>` : ''}</div>
      <div class="amt">${fa(p.amount)}<small>تومان</small></div></article>`
    }).join('')
  }
}
const empty = (t, cta) => `<div class="empty">${t}${cta ? '<br><code>N — لینک جدید</code>' : ''}</div>`

async function linkAction(a, id) {
  const l = S.links.find((x) => x.id === id)
  if (a === 'copy') return copy(l.url)
  if (a === 'share') return share(l)
  if (a === 'open') return tg ? tg.openLink(l.url) : window.open(l.url, '_blank', 'noopener')
  if (a === 'toggle') { await api('PATCH', `/api/links/${id}`, { active: !l.active }); toast(l.active ? 'لینک متوقف شد' : 'لینک فعال شد'); return load() }
  if (a === 'del') {
    const ok = await new Promise((res) => (tg?.showConfirm ? tg.showConfirm('این لینک حذف بشه؟', res) : res(confirm('این لینک حذف بشه؟'))))
    if (!ok) return
    await api('DELETE', `/api/links/${id}`); toast('لینک حذف شد'); load()
  }
}

function sheet(html) { $('#sheet').innerHTML = html; $('#sheet-bg').classList.add('on') }
function closeSheet() { $('#sheet-bg').classList.remove('on') }
$('#sheet-bg').onclick = (e) => { if (e.target.id === 'sheet-bg') closeSheet() }
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return closeSheet()
  const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName ?? '')
  if (['n', 'N', 'د'].includes(e.key) && !e.ctrlKey && !e.metaKey && !typing && $('#tabs') && !$('#sheet-bg').classList.contains('on')) { e.preventDefault(); openCreate() }
})

function openCreate() {
  sheet(`<div class="sheet-h"><h3>لینک پرداخت جدید</h3><kbd>Esc</kbd></div><form id="cf">
    <div class="field" id="amount-f"><label for="amt">مبلغ</label>
      <div class="amount-input"><input class="input" name="amount" id="amt" inputmode="numeric" autocomplete="off" placeholder="۰"><span>تومان</span></div>
      <div class="hint" id="w"></div>
      <div class="chips" id="chips">${[100000, 250000, 500000, 1000000, 2000000, 5000000].map((n) => `<button type="button" data-n="${n}">${short(n)}</button>`).join('')}</div></div>
    <div class="field"><label for="ttl">عنوان</label><input class="input" id="ttl" name="title" maxlength="120" placeholder="مثلاً طراحی سایت"></div>
    <div class="field"><label for="dsc">توضیح <small>برای پرداخت‌کننده</small></label><textarea class="input" id="dsc" name="description" rows="2" maxlength="600"></textarea></div>
    <label class="toggle"><div><b>مبلغ آزاد</b><small>پرداخت‌کننده خودش مبلغ رو می‌نویسه</small></div><input type="checkbox" name="open" id="open"></label>
    <label class="toggle"><div><b>یک‌بار مصرف</b><small>بعد از اولین پرداخت موفق بسته می‌شه</small></div><input type="checkbox" name="single" checked></label>
    <div id="cerr"></div>
    <button class="btn" id="cb" style="margin-top:10px"><span class="spin"></span>ساخت لینک<kbd>↵</kbd></button></form>`)
  const amt = $('#amt'), w = $('#w')
  const upd = () => { const n = Number(en(amt.value)); amt.value = n ? fa(n) : ''; w.textContent = n ? words(n) : '' }
  amt.oninput = upd
  $('#chips').querySelectorAll('button').forEach((b) => (b.onclick = () => { amt.value = b.dataset.n; upd(); tg?.HapticFeedback?.selectionChanged() }))
  $('#open').onchange = (e) => { $('#amount-f').style.display = e.target.checked ? 'none' : '' }
  setTimeout(() => amt.focus(), 80)
  $('#cf').onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target)
    const body = { amount: f.get('open') ? null : Number(en(f.get('amount'))), title: f.get('title'), description: f.get('description'), single_use: Boolean(f.get('single')) }
    $('#cb').disabled = true
    try { const l = await api('POST', '/api/links', body); showCreated(l); load() }
    catch (x) { $('#cerr').innerHTML = `<div class="err"><span>${esc(x.message)}</span></div>`; $('#cb').disabled = false }
  }
}

function showCreated(l) {
  tg?.HapticFeedback?.notificationOccurred('success')
  sheet(`<div class="sheet-h"><h3>لینک آماده‌ست</h3><kbd>Esc</kbd></div>
    <div style="display:flex;align-items:center;gap:12px"><div class="badge-ic ok" style="margin:0;width:42px;height:42px">${I.ok}</div>
      <div><b style="display:block">${esc(l.title || 'لینک پرداخت')}</b><small style="color:var(--muted)">${l.amount ? fa(l.amount) + ' تومان' : 'مبلغ آزاد'} · ${l.single_use ? 'یک‌بار مصرف' : 'چندبار مصرف'}</small></div></div>
    <div class="urlbox"><code>${esc(l.url)}</code><button id="cp">کپی</button></div>
    <div class="actions"><button class="btn" id="sh">${tg ? 'ارسال در تلگرام' : 'اشتراک‌گذاری'}</button><button class="btn ghost" id="done">بستن</button></div>`)
  $('#cp').onclick = () => copy(l.url)
  $('#sh').onclick = () => share(l)
  $('#done').onclick = closeSheet
}

async function load() {
  try {
    const [stats, links, payments] = await Promise.all([api('GET', '/api/stats'), api('GET', '/api/links'), api('GET', '/api/payments')])
    Object.assign(S, { stats, links, payments }); renderKpis(); render()
  } catch (x) { if (x.message !== 'unauth') toast(x.message) }
}

async function boot() {
  if (tg?.initData) {
    document.documentElement.dataset.theme = tg.colorScheme === 'light' ? 'light' : 'dark'
    const bg = tg.colorScheme === 'light' ? '#fafafa' : '#09090b'
    tg.ready(); tg.expand(); tg.setHeaderColor?.(bg); tg.setBackgroundColor?.(bg)
    try { const r = await api('POST', '/api/tg-login', { initData: tg.initData }); setToken(r.token) }
    catch { $('#app').innerHTML = `<main class="wrap"><div class="stack"><div class="card state"><div class="badge-ic bad">${I.x}</div><h1>دسترسی نداری</h1><p class="desc">این پنل فقط برای صاحبش باز می‌شه.</p></div></div></main>`; return }
  }
  if (!token) return renderLogin()
  shell(); load()
}

// اسکریپت تلگرام فقط داخل مینی‌اپ لود می‌شه (بیرون از تلگرام، telegram.org ممکنه در دسترس نباشه)
if (/tgWebApp/.test(location.hash + location.search)) {
  const s = document.createElement('script'); s.src = 'https://telegram.org/js/telegram-web-app.js'
  s.onload = () => { tg = window.Telegram?.WebApp; boot() }; s.onerror = boot; document.head.append(s)
} else boot()
</script>
</body>
</html>
