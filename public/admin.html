<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#07071a">
<meta name="robots" content="noindex">
<title>پرداخت من</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop stop-color='%238b5cf6'/><stop offset='1' stop-color='%2322d3ee'/></linearGradient></defs><rect width='64' height='64' rx='18' fill='url(%23g)'/><path d='M18 34l9 9 19-21' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="/base.css">
<style>
.wrap{display:block;place-items:initial;padding:0 16px 120px;max-width:760px;margin:0 auto}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:16px 0 12px;
  background:linear-gradient(var(--bg) 60%,transparent)}
.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:conic-gradient(from 200deg,var(--a1),var(--a3),var(--a2),var(--a1));box-shadow:0 10px 30px -8px var(--a1)}
.logo svg{width:22px;height:22px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.top h2{margin:0;font-size:18px;font-weight:800}.top small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:-2px}
.icon-btn{margin-inline-start:auto;width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--card-2);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:19px;height:19px}
.hero{border-radius:28px;padding:22px;margin:6px 0 14px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#7c3aed,#4f46e5 55%,#0891b2);box-shadow:0 30px 70px -25px rgba(124,58,237,.9)}
.hero::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12);top:-120px;left:-60px}
.hero::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;border:30px solid rgba(255,255,255,.08);bottom:-90px;right:30%}
.hero>*{position:relative}
.hero .label{color:rgba(255,255,255,.75)}
.hero .big{font-size:34px;font-weight:900;letter-spacing:-.5px;line-height:1.35}
.hero .big small{font-size:14px;font-weight:600;opacity:.75;margin-inline-start:6px}
.hero .sub{display:flex;gap:18px;margin-top:10px;font-size:13px;color:rgba(255,255,255,.85);flex-wrap:wrap}
.hero .sub b{font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 0 0 1px var(--line) inset;backdrop-filter:blur(18px)}
.stat .label{font-size:11.5px}.stat b{display:block;font-size:17px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:6px;padding:5px;border-radius:18px;background:var(--card);box-shadow:0 0 0 1px var(--line) inset;margin-bottom:14px}
.tabs button{flex:1;border:0;font:inherit;font-weight:700;font-size:14px;color:var(--muted);background:none;padding:10px;border-radius:14px;cursor:pointer;transition:.2s}
.tabs button.on{color:#fff;background:linear-gradient(135deg,rgba(139,92,246,.55),rgba(14,165,233,.35));box-shadow:0 8px 20px -10px var(--a1)}
.filters{display:flex;gap:6px;margin:-4px 0 12px;overflow-x:auto;scrollbar-width:none}
.filters button{border:1px solid var(--line);background:var(--card-2);color:var(--muted);font:inherit;font-size:12.5px;padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.filters button.on{color:var(--ink);border-color:rgba(139,92,246,.6);background:rgba(139,92,246,.18)}
.list{display:grid;gap:10px}
.item{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 0 0 1px var(--line) inset;backdrop-filter:blur(18px);animation:rise .4s both}
.item-h{display:flex;align-items:flex-start;gap:12px}
.dot{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:18px}
.dot.active{background:rgba(139,92,246,.18);color:#c4b5fd}.dot.paid,.dot.ok{background:rgba(52,211,153,.15);color:var(--ok)}
.dot.off,.dot.init{background:rgba(255,255,255,.06);color:var(--faint)}.dot.failed{background:rgba(251,113,133,.14);color:var(--bad)}
.dot svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.item-t{flex:1;min-width:0}.item-t b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-t small{color:var(--muted);font-size:12.5px}
.item-a{text-align:left;white-space:nowrap}.item-a b{display:block;font-size:15.5px;font-weight:800}.item-a small{font-size:11.5px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;margin-top:4px}
.pill.active{background:rgba(139,92,246,.18);color:#c4b5fd}.pill.paid,.pill.ok{background:rgba(52,211,153,.14);color:var(--ok)}
.pill.off,.pill.init{background:rgba(255,255,255,.07);color:var(--muted)}.pill.failed{background:rgba(251,113,133,.14);color:var(--bad)}
.acts{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card-2);color:var(--ink);font:inherit;font-size:12.5px;font-weight:600;padding:8px;border-radius:12px;cursor:pointer}
.acts button svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.acts button.danger{color:var(--bad)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}.meta b{color:var(--ink);font-weight:600}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}.empty .badge-ic{width:72px;height:72px}
.fab{position:fixed;z-index:6;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:728px}
.fab .btn{margin:0;padding:17px;font-size:16.5px}
.sheet-bg{position:fixed;inset:0;z-index:10;background:rgba(3,3,12,.6);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet-bg.on{display:flex}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:#12112b;border-radius:30px 30px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.5),0 0 0 1px var(--line) inset;animation:up .35s cubic-bezier(.2,.8,.2,1)}
@media(min-width:560px){.sheet-bg{align-items:center}.sheet{border-radius:30px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.18);margin:4px auto 16px}
.sheet h3{margin:0 0 14px;font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 14px}
.chips button{border:1px solid var(--line);background:var(--card-2);color:var(--ink);font:inherit;font-size:12.5px;padding:6px 12px;border-radius:999px;cursor:pointer}
.toggle{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card-2);border:1px solid var(--line);margin-bottom:10px;cursor:pointer}
.toggle div{flex:1}.toggle b{display:block;font-size:14px}.toggle small{color:var(--muted);font-size:12px}
.toggle input{appearance:none;width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;cursor:pointer;transition:.2s;flex:none}
.toggle input::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.toggle input:checked{background:var(--a1)}.toggle input:checked::after{right:21px}
.linkbox{display:flex;align-items:center;gap:8px;background:var(--card-2);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px;margin:14px 0}
.linkbox code{flex:1;direction:ltr;text-align:left;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c4b5fd}
.linkbox button{border:0;background:var(--a1);color:#fff;font:inherit;font-weight:700;font-size:13px;padding:8px 14px;border-radius:12px;cursor:pointer}
.share{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.share .btn{margin:0;font-size:14px;padding:13px}
.toast{position:fixed;z-index:20;top:18px;left:50%;transform:translate(-50%,-30px);opacity:0;background:#1f1d45;border:1px solid var(--line);padding:10px 18px;border-radius:14px;font-size:14px;transition:.3s;pointer-events:none;box-shadow:0 20px 40px -10px rgba(0,0,0,.6)}
.toast.on{transform:translate(-50%,0);opacity:1}
.login{min-height:100vh;display:grid;place-items:center}
.skeleton{height:84px;border-radius:22px;background:linear-gradient(90deg,var(--card-2),rgba(255,255,255,.08),var(--card-2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<main class="wrap" id="app"></main>
<div class="sheet-bg" id="sheet-bg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const $ = (s) => document.querySelector(s)
const fa = (n) => Number(n || 0).toLocaleString('fa-IR')
const en = (s) => String(s).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^0-9]/g, '')
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const DATE = new Intl.DateTimeFormat('fa-IR-u-ca-persian', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tehran' })
const date = (iso) => (iso ? DATE.format(new Date(iso)) : '')
function words(n) {
  const p = [], b = Math.floor(n / 1e9), m = Math.floor((n % 1e9) / 1e6), k = Math.floor((n % 1e6) / 1e3), r = n % 1e3
  if (b) p.push(fa(b) + ' میلیارد'); if (m) p.push(fa(m) + ' میلیون'); if (k) p.push(fa(k) + ' هزار'); if (r) p.push(fa(r))
  return p.join(' و ') + ' تومان'
}
const short = (n) => (n >= 1e9 ? fa(+(n / 1e9).toFixed(1)) + ' میلیارد' : n >= 1e6 ? fa(+(n / 1e6).toFixed(1)) + ' میلیون' : n >= 1e3 ? fa(Math.round(n / 1e3)) + ' هزار' : fa(n))

const I = {
  link: '<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></svg>',
  copy: '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
  share: '<svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg>',
  out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>',
  plus: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  logo: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
}

let tg = window.Telegram?.WebApp
let token = null
try { token = localStorage.getItem('mp_token') } catch {}
const S = { tab: 'links', filter: 'all', links: null, payments: null, stats: null }

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined })
  const j = await r.json().catch(() => ({}))
  if (r.status === 401 && path !== '/api/login') { logout(); throw new Error('unauth') }
  if (!r.ok) throw new Error(j.error || 'خطایی پیش اومد')
  return j
}
function setToken(t) { token = t; try { t ? localStorage.setItem('mp_token', t) : localStorage.removeItem('mp_token') } catch {} }
function logout() { setToken(null); renderLogin() }
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2200); tg?.HapticFeedback?.notificationOccurred('success') }
async function copy(t) { try { await navigator.clipboard.writeText(t) } catch { const a = document.createElement('textarea'); a.value = t; document.body.append(a); a.select(); document.execCommand('copy'); a.remove() } toast('لینک کپی شد') }
function share(l) {
  const text = `${l.title || 'لینک پرداخت'}${l.amount ? ' — ' + fa(l.amount) + ' تومان' : ''}`
  if (tg) return tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(l.url)}&text=${encodeURIComponent(text)}`)
  if (navigator.share) return navigator.share({ title: text, text, url: l.url }).catch(() => {})
  copy(l.url)
}

function renderLogin(err = '') {
  $('#app').innerHTML = `<div class="login"><form class="card" id="lf">
    <div class="owner"><div class="logo">${I.logo}</div><div><b>پرداخت من</b><small>ورود به پنل مدیریت</small></div></div>
    ${err ? `<div class="err">${esc(err)}</div>` : ''}
    <div class="field"><label>نام کاربری</label><input class="input" name="user" autocomplete="username" dir="ltr" required></div>
    <div class="field"><label>رمز عبور</label><input class="input" name="pass" type="password" autocomplete="current-password" dir="ltr" required></div>
    <button class="btn" id="lb">ورود</button></form></div>`
  $('#lf').onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target); $('#lb').disabled = true
    try { const r = await api('POST', '/api/login', { user: f.get('user'), pass: f.get('pass') }); setToken(r.token); boot() }
    catch (x) { renderLogin(x.message) }
  }
}

function shell() {
  $('#app').innerHTML = `
  <header class="top"><div class="logo">${I.logo}</div><div><h2>پرداخت من</h2><small>لینک پرداخت بساز و بفرست</small></div>
    ${tg?.initData ? '' : `<button class="icon-btn" id="out" title="خروج">${I.out}</button>`}</header>
  <section id="hero"></section>
  <nav class="tabs"><button data-t="links">لینک‌ها</button><button data-t="payments">پرداخت‌ها</button></nav>
  <div class="filters" id="filters"></div>
  <section class="list" id="list"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></section>
  <div class="fab"><button class="btn" id="new">${I.plus} ساخت لینک پرداخت</button></div>`
  $('#out') && ($('#out').onclick = logout)
  $('#new').onclick = openCreate
  document.querySelectorAll('.tabs button').forEach((b) => (b.onclick = () => { S.tab = b.dataset.t; S.filter = 'all'; tg?.HapticFeedback?.selectionChanged(); render() }))
}

function renderHero() {
  const s = S.stats
  if (!s) return
  $('#hero').innerHTML = `<div class="hero"><div class="label">کل دریافتی</div>
    <div class="big">${fa(s.total_sum)}<small>تومان</small></div>
    <div class="sub"><span>امروز <b>${short(s.today_sum)}</b></span><span>۳۰ روز اخیر <b>${short(s.month_sum)}</b></span></div></div>
    <div class="stats"><div class="stat"><div class="label">پرداخت موفق</div><b>${fa(s.total_count)}</b></div>
    <div class="stat"><div class="label">لینک فعال</div><b>${fa(s.active_links)}</b></div>
    <div class="stat"><div class="label">۳۰ روز اخیر</div><b>${fa(s.month_count)} پرداخت</b></div></div>`
}

const LINK_STATE = { active: ['فعال', I.link], paid: ['پرداخت شد', I.check], off: ['غیرفعال', I.pause] }
const PAY_STATE = { paid: ['موفق', I.check, 'ok'], failed: ['ناموفق', I.x, 'failed'], init: ['نیمه‌کاره', I.clock, 'init'] }

function render() {
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === S.tab))
  const F = S.tab === 'links' ? [['all', 'همه'], ['active', 'فعال'], ['paid', 'پرداخت‌شده'], ['off', 'غیرفعال']] : [['all', 'همه'], ['paid', 'موفق'], ['failed', 'ناموفق'], ['init', 'نیمه‌کاره']]
  $('#filters').innerHTML = F.map(([k, t]) => `<button class="${S.filter === k ? 'on' : ''}" data-f="${k}">${t}</button>`).join('')
  document.querySelectorAll('#filters button').forEach((b) => (b.onclick = () => { S.filter = b.dataset.f; render() }))
  const list = $('#list')
  if (S.tab === 'links') {
    if (!S.links) return
    const rows = S.links.filter((l) => S.filter === 'all' || l.state === S.filter)
    if (!rows.length) return (list.innerHTML = empty(S.links.length ? 'چیزی با این فیلتر نیست' : 'هنوز لینکی نساختی؛ اولین لینک پرداخت رو بساز'))
    list.innerHTML = rows.map((l) => { const [st, ic] = LINK_STATE[l.state]; return `<article class="item">
      <div class="item-h"><div class="dot ${l.state}">${ic}</div>
        <div class="item-t"><b>${esc(l.title || 'لینک پرداخت')}</b><small>${date(l.created_at)}${l.single_use ? '' : ' · چندبار مصرف'}</small><br><span class="pill ${l.state}">${st}</span></div>
        <div class="item-a"><b>${l.amount ? fa(l.amount) : 'مبلغ آزاد'}</b><small>${l.amount ? 'تومان' : 'پرداخت‌کننده وارد می‌کنه'}</small></div></div>
      ${l.paid_count ? `<div class="meta"><span>دریافتی: <b>${fa(l.paid_sum)} تومان</b></span><span>تعداد: <b>${fa(l.paid_count)}</b></span></div>` : ''}
      <div class="acts"><button data-a="copy" data-id="${l.id}">${I.copy} کپی</button><button data-a="share" data-id="${l.id}">${I.share} ارسال</button>
        <button data-a="toggle" data-id="${l.id}">${l.active ? I.pause + ' توقف' : I.play + ' فعال'}</button><button class="danger" data-a="del" data-id="${l.id}">${I.trash}</button></div></article>` }).join('')
    list.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => linkAction(b.dataset.a, Number(b.dataset.id))))
  } else {
    if (!S.payments) return
    const rows = S.payments.filter((p) => S.filter === 'all' || p.status === S.filter)
    if (!rows.length) return (list.innerHTML = empty(S.payments.length ? 'چیزی با این فیلتر نیست' : 'هنوز پرداختی انجام نشده'))
    list.innerHTML = rows.map((p) => { const [st, ic, cls] = PAY_STATE[p.status]; return `<article class="item">
      <div class="item-h"><div class="dot ${cls}">${ic}</div>
        <div class="item-t"><b>${esc(p.payer_name || p.title || 'پرداخت')}</b><small>${date(p.paid_at || p.created_at)}</small><br><span class="pill ${cls}">${st}</span></div>
        <div class="item-a"><b>${fa(p.amount)}</b><small>تومان</small></div></div>
      <div class="meta">${p.title ? `<span>بابت: <b>${esc(p.title)}</b></span>` : ''}${p.payer_phone ? `<span>موبایل: <b dir="ltr">${esc(p.payer_phone)}</b></span>` : ''}
        ${p.ref_id ? `<span>کد پیگیری: <b dir="ltr">${esc(p.ref_id)}</b></span>` : ''}${p.card_pan ? `<span>کارت: <b dir="ltr">${esc(p.card_pan)}</b></span>` : ''}
        ${p.note ? `<span>توضیح: <b>${esc(p.note)}</b></span>` : ''}</div></article>` }).join('')
  }
}
const empty = (t) => `<div class="empty"><div class="badge-ic muted">${I.link.replace('<svg', '<svg style="width:32px;height:32px;stroke:#fff;stroke-width:2.2;fill:none"')}</div>${t}</div>`

async function linkAction(a, id) {
  const l = S.links.find((x) => x.id === id)
  if (a === 'copy') return copy(l.url)
  if (a === 'share') return share(l)
  if (a === 'toggle') { await api('PATCH', `/api/links/${id}`, { active: !l.active }); toast(l.active ? 'لینک متوقف شد' : 'لینک فعال شد'); return load() }
  if (a === 'del') {
    const ok = await new Promise((res) => (tg?.showConfirm ? tg.showConfirm('این لینک حذف بشه؟', res) : res(confirm('این لینک حذف بشه؟'))))
    if (!ok) return
    await api('DELETE', `/api/links/${id}`); toast('لینک حذف شد'); load()
  }
}

function sheet(html) { $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#sheet-bg').classList.add('on') }
function closeSheet() { $('#sheet-bg').classList.remove('on') }
$('#sheet-bg').onclick = (e) => { if (e.target.id === 'sheet-bg') closeSheet() }

function openCreate() {
  sheet(`<h3>لینک پرداخت جدید</h3><form id="cf">
    <div class="field" id="amount-f"><label>مبلغ (تومان)</label><input class="input big" name="amount" id="amt" inputmode="numeric" autocomplete="off" placeholder="۰">
      <div class="words" id="w" style="text-align:center;margin-top:6px">&nbsp;</div></div>
    <div class="chips" id="chips">${[100000, 250000, 500000, 1000000, 2000000, 5000000].map((n) => `<button type="button" data-n="${n}">${short(n)}</button>`).join('')}</div>
    <div class="field"><label>بابت</label><input class="input" name="title" maxlength="120" placeholder="مثلاً طراحی سایت"></div>
    <div class="field"><label>توضیح برای پرداخت‌کننده</label><textarea class="input" name="description" rows="2" maxlength="600" placeholder="اختیاری"></textarea></div>
    <label class="toggle"><div><b>مبلغ آزاد</b><small>پرداخت‌کننده خودش مبلغ رو وارد کنه</small></div><input type="checkbox" name="open" id="open"></label>
    <label class="toggle"><div><b>یک‌بار مصرف</b><small>بعد از اولین پرداخت موفق بسته می‌شه</small></div><input type="checkbox" name="single" checked></label>
    <div class="err" id="cerr" style="display:none"></div>
    <button class="btn" id="cb">${I.link.replace('<svg', '<svg width="20" height="20" style="stroke:#fff;stroke-width:2.2;fill:none"')} ساخت لینک</button></form>`)
  const amt = $('#amt'), w = $('#w')
  const upd = () => { const n = Number(en(amt.value)); amt.value = n ? fa(n) : ''; w.innerHTML = n ? words(n) : '&nbsp;' }
  amt.oninput = upd
  $('#chips').querySelectorAll('button').forEach((b) => (b.onclick = () => { amt.value = b.dataset.n; upd(); tg?.HapticFeedback?.selectionChanged() }))
  $('#open').onchange = (e) => { $('#amount-f').style.display = $('#chips').style.display = e.target.checked ? 'none' : '' }
  setTimeout(() => amt.focus(), 250)
  $('#cf').onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target)
    const body = { amount: f.get('open') ? null : Number(en(f.get('amount'))), title: f.get('title'), description: f.get('description'), single_use: Boolean(f.get('single')) }
    $('#cb').disabled = true
    try { const l = await api('POST', '/api/links', body); showCreated(l); load() }
    catch (x) { $('#cerr').style.display = ''; $('#cerr').textContent = x.message; $('#cb').disabled = false }
  }
}

function showCreated(l) {
  tg?.HapticFeedback?.notificationOccurred('success')
  sheet(`<div class="state"><div class="badge-ic ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h3 style="margin-bottom:4px">لینک پرداخت آماده‌ست</h3><p class="desc" style="margin:0">${esc(l.title || '')}${l.amount ? ' — ' + fa(l.amount) + ' تومان' : ' — مبلغ آزاد'}</p></div>
    <div class="linkbox"><code>${esc(l.url)}</code><button id="cp">کپی</button></div>
    <div class="share"><button class="btn" id="sh">${tg ? 'ارسال در تلگرام' : 'اشتراک‌گذاری'}</button><a class="btn ghost" href="${esc(l.url)}" target="_blank" rel="noopener">پیش‌نمایش</a></div>
    <button class="btn ghost" id="done" style="margin-top:8px">بستن</button>`)
  $('#cp').onclick = () => copy(l.url)
  $('#sh').onclick = () => share(l)
  $('#done').onclick = closeSheet
}

async function load() {
  try {
    const [stats, links, payments] = await Promise.all([api('GET', '/api/stats'), api('GET', '/api/links'), api('GET', '/api/payments')])
    Object.assign(S, { stats, links, payments }); renderHero(); render()
  } catch (x) { if (x.message !== 'unauth') toast(x.message) }
}

async function boot() {
  if (tg?.initData) {
    tg.ready(); tg.expand(); tg.setHeaderColor?.('#07071a'); tg.setBackgroundColor?.('#07071a')
    try { const r = await api('POST', '/api/tg-login', { initData: tg.initData }); setToken(r.token) }
    catch (x) { $('#app').innerHTML = `<div class="login"><div class="card state"><div class="badge-ic bad"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></div><h1>دسترسی نداری</h1><p class="desc">این پنل فقط برای صاحبش باز می‌شه.</p></div></div>`; return }
  }
  if (!token) return renderLogin()
  shell(); load()
}

// اسکریپت تلگرام فقط داخل مینی‌اپ لود می‌شه (بیرون از تلگرام، telegram.org ممکنه در دسترس نباشه)
if (/tgWebApp/.test(location.hash + location.search)) {
  const s = document.createElement('script'); s.src = 'https://telegram.org/js/telegram-web-app.js'
  s.onload = () => { tg = window.Telegram?.WebApp; boot() }; s.onerror = boot; document.head.append(s)
} else boot()
</script>
</body>
</html>
